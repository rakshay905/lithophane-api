<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password — Lithophane Studio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0b1a;color:#e0d4ff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#15122a;border:1px solid rgba(130,100,255,.25);border-radius:16px;padding:40px 32px;width:100%;max-width:400px}
.logo{text-align:center;margin-bottom:24px}
.logo h1{font-size:22px;color:#e0d4ff}
.logo p{color:#8070bb;font-size:13px;margin-top:4px}
.flash{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px}
.flash.error{background:rgba(220,50,50,.15);border:1px solid rgba(220,50,50,.3);color:#f08080}
.flash.success{background:rgba(50,200,100,.12);border:1px solid rgba(50,200,100,.3);color:#70e090}
label{display:block;font-size:12px;color:#9080bb;margin-bottom:5px;margin-top:14px}
input[type=password]{width:100%;background:#0d0b1a;border:1px solid rgba(130,100,255,.3);border-radius:8px;padding:10px 12px;color:#e0d4ff;font-size:14px;outline:none;transition:border-color .2s}
input:focus{border-color:#7c3aed}
.btn{width:100%;background:linear-gradient(135deg,#7c3aed,#4f46e5);border:none;border-radius:8px;padding:12px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;margin-top:20px;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn:disabled{opacity:.4;cursor:not-allowed}
.links{text-align:center;margin-top:16px;font-size:13px}
.links a{color:#a080ff;text-decoration:none}
.expired-box{background:rgba(220,50,50,.12);border:1px solid rgba(220,50,50,.3);border-radius:10px;padding:18px;text-align:center;margin-bottom:16px}
.expired-box p{color:#f08080;font-size:13px;line-height:1.6}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>🔦 Lithophane Studio</h1>
    <p>Set a new password</p>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
  {% for cat, msg in messages %}
  <div class="flash {{ cat }}">{{ msg }}</div>
  {% endfor %}
  {% endwith %}

  {% if expired %}
  <div class="expired-box">
    <p>This reset link has expired or already been used.</p>
  </div>
  <div class="links"><a href="/forgot-password">Request a new link</a></div>
  {% else %}
  <form method="POST" action="/reset-password/{{ token }}">
    <label>New password</label>
    <input type="password" name="password" required autofocus placeholder="Min 6 characters">
    <label>Confirm password</label>
    <input type="password" name="confirm" required placeholder="Same as above">
    <button type="submit" class="btn">Update Password</button>
  </form>
  <div class="links"><a href="/login">Back to login</a></div>
  {% endif %}
</div>
</body>
</html>
