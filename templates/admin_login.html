<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login — Lithophane Studio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0812;color:#e0d4ff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#120f24;border:1px solid rgba(130,100,255,.2);border-radius:14px;padding:36px 30px;width:100%;max-width:360px}
h2{font-size:18px;text-align:center;margin-bottom:20px;color:#c0b0f0}
.flash{padding:9px 12px;border-radius:7px;font-size:13px;margin-bottom:14px;background:rgba(220,50,50,.15);border:1px solid rgba(220,50,50,.3);color:#f08080}
label{display:block;font-size:12px;color:#8070a8;margin-bottom:4px;margin-top:12px}
input{width:100%;background:#0a0812;border:1px solid rgba(130,100,255,.25);border-radius:7px;padding:9px 11px;color:#e0d4ff;font-size:13px;outline:none}
input:focus{border-color:#7c3aed}
.btn{width:100%;background:linear-gradient(135deg,#6d28d9,#4338ca);border:none;border-radius:7px;padding:11px;color:#fff;font-size:13px;font-weight:600;cursor:pointer;margin-top:18px}
.btn:hover{opacity:.85}
</style>
</head>
<body>
<div class="card">
  <h2>🛡️ Admin Panel</h2>
  {% with messages = get_flashed_messages(with_categories=true) %}
  {% for cat, msg in messages %}<div class="flash">{{ msg }}</div>{% endfor %}
  {% endwith %}
  <form method="POST" action="/admin/login">
    <label>Email</label>
    <input type="email" name="email" required autofocus>
    <label>Password</label>
    <input type="password" name="password" required>
    <button type="submit" class="btn">Sign In</button>
  </form>
</div>
</body>
</html>
