<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forgot Password — Lithophane Studio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0b1a;color:#e0d4ff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#15122a;border:1px solid rgba(130,100,255,.25);border-radius:16px;padding:40px 32px;width:100%;max-width:400px}
.logo{text-align:center;margin-bottom:24px}
.logo h1{font-size:22px;color:#e0d4ff}
.logo p{color:#8070bb;font-size:13px;margin-top:4px}
.sent-box{background:rgba(50,200,100,.1);border:1px solid rgba(50,200,100,.25);border-radius:10px;padding:20px;text-align:center}
.sent-box .icon{font-size:36px;margin-bottom:12px}
.sent-box p{color:#70e090;font-size:14px;line-height:1.6}
label{display:block;font-size:12px;color:#9080bb;margin-bottom:5px;margin-top:14px}
input[type=email]{width:100%;background:#0d0b1a;border:1px solid rgba(130,100,255,.3);border-radius:8px;padding:10px 12px;color:#e0d4ff;font-size:14px;outline:none;transition:border-color .2s}
input:focus{border-color:#7c3aed}
.btn{width:100%;background:linear-gradient(135deg,#7c3aed,#4f46e5);border:none;border-radius:8px;padding:12px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;margin-top:20px;transition:opacity .2s}
.btn:hover{opacity:.85}
.links{text-align:center;margin-top:16px;font-size:13px}
.links a{color:#a080ff;text-decoration:none}
.links a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>🔦 Lithophane Studio</h1>
    <p>Reset your password</p>
  </div>

  {% if sent %}
  <div class="sent-box">
    <div class="icon">📬</div>
    <p>If that email is registered, we've sent a password reset link.<br>Check your inbox (and spam folder).</p>
  </div>
  <div class="links" style="margin-top:20px"><a href="/login">Back to login</a></div>
  {% else %}
  <p style="color:#9080bb;font-size:13px;margin-bottom:4px">Enter your account email and we'll send you a reset link.</p>
  <form method="POST" action="/forgot-password">
    <label>Email address</label>
    <input type="email" name="email" required autofocus placeholder="you@example.com">
    <button type="submit" class="btn">Send Reset Link</button>
  </form>
  <div class="links"><a href="/login">Back to login</a></div>
  {% endif %}
</div>
</body>
</html>
